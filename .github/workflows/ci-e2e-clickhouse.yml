# E2E integration tests for ClickHouse storage backend (Jaeger v2 only).

name: CIT ClickHouse

on:
  workflow_call:

# See https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  clickhouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clickhouse_version:
        - lts-march
        - lts-august
    name: clickhouse ${{ matrix.clickhouse_version }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: ./.github/actions/setup-go

    - name: Start ClickHouse
      id: start
      run: bash scripts/e2e/clickhouse.sh start ${{ matrix.clickhouse_version }}

    - name: Run direct tests with replicated tables
      run: STORAGE=clickhouse make storage-integration-test

    - name: Upload direct coverage
      uses: ./.github/actions/upload-codecov
      with:
        flag: clickhouse-direct-${{ matrix.clickhouse_version }}

    - name: Run end-to-end tests with local tables
      id: e2e
      if: ${{ !cancelled() && steps.start.outcome == 'success' }}
      run: STORAGE=clickhouse make jaeger-v2-storage-integration-test

    - uses: ./.github/actions/verify-metrics-snapshot
      if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
      with:
        snapshot: metrics_snapshot_clickhouse
        artifact_key: metrics_snapshot_clickhouse_${{ matrix.clickhouse_version }}

    - name: Upload e2e coverage
      if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
      uses: ./.github/actions/upload-codecov
      with:
        flag: clickhouse-e2e-${{ matrix.clickhouse_version }}

    - name: Dump ClickHouse logs
      if: failure()
      run: docker logs clickhouse

    - name: Stop ClickHouse
      if: always()
      run: bash scripts/e2e/clickhouse.sh stop ${{ matrix.clickhouse_version }}


